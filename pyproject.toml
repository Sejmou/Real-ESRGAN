[project]
name = "real-esrgan"
version = "0.1.0"
# basicsr calls some old version of torchvision
requires-python = ">=3.10,<3.11"
dependencies = [
    "basicsr>=1.4.2",
    "facexlib>=0.2.5",
    "gfpgan>=1.3.5",
    "numpy>=1,<2",
    "opencv-python",
    "pillow",
    "torch>=1.7",
    "torchvision>=0.14,<0.15",
    "tqdm",
]

# --- PyTorch index configuration ---
# c.f. https://docs.astral.sh/uv/guides/integration/pytorch/#using-a-pytorch-index
# CUDA 13.0 wheels should work for NVIDIA GPU driver versions >= 580
# The RTX 3090 I own (sm_86, Ampere) was on version 595.84 at the time of this writing

# The sys_platform marker gates the CUDA index to Linux/Windows, falling back
# to PyPI on macOS (no CUDA builds there), as recommended in the uv docs.
[tool.uv.sources]
torch = [
  { index = "pytorch-cu117", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu117", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

# `explicit = true` ensures this index is ONLY used for torch/torchvision,
# and everything else (transformers etc.) still comes from PyPI.
[[tool.uv.index]]
name = "pytorch-cu117"
url = "https://download.pytorch.org/whl/cu117"
explicit = true
